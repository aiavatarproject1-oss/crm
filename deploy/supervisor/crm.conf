; AI Influencer CRM — Supervisor programs
; Copy to /etc/supervisor/conf.d/ and run `sudo supervisorctl reread`
; autostart=false: start each program yourself with `sudo supervisorctl start <name>`
; or run the artisan/npm commands manually during local testing.

[program:crm-api]
command=/usr/bin/php artisan serve --host=0.0.0.0 --port=8000
directory=/home/amirreza/projects/Ai Influencer/crm
user=amirreza
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisor-api.log
stderr_logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisor-api.err.log
environment=HOME="/home/amirreza"

[program:crm-horizon]
command=/usr/bin/php artisan horizon
directory=/home/amirreza/projects/Ai Influencer/crm
user=amirreza
autostart=false
autorestart=true
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisor-horizon.log
stderr_logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisor-horizon.err.log
environment=HOME="/home/amirreza"

[program:crm-queue]
command=/usr/bin/php artisan queue:work redis --queue=default --sleep=1 --tries=3 --timeout=320 --memory=512
directory=/home/amirreza/projects/Ai Influencer/crm
user=amirreza
autostart=false
autorestart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisor-queue.log
stderr_logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisor-queue.err.log
environment=HOME="/home/amirreza"

[program:crm-reverb]
command=/usr/bin/php artisan reverb:start --no-interaction
directory=/home/amirreza/projects/Ai Influencer/crm
user=amirreza
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisor-reverb.log
stderr_logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisor-reverb.err.log
environment=HOME="/home/amirreza"

[program:crm-admin]
command=/usr/bin/npm run start -- --hostname 0.0.0.0 --port 3000
directory=/home/amirreza/projects/Ai Influencer/crm/admin
user=amirreza
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisor-admin.log
stderr_logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisor-admin.err.log
environment=HOME="/home/amirreza",NODE_ENV="production"

; Dev server for the admin UI (use this OR crm-admin, not both).
[program:crm-admin-dev]
command=/usr/bin/npm run dev -- --hostname 0.0.0.0 --port 3000
directory=/home/amirreza/projects/Ai Influencer/crm/admin
user=amirreza
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisor-admin-dev.log
stderr_logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisor-admin-dev.err.log
environment=HOME="/home/amirreza",NODE_ENV="development"
