; Project-local supervisord (does NOT need root).
; Install:  python3 -m venv .venv && .venv/bin/pip install supervisor
; Start daemon later (not now):  .venv/bin/supervisord -c supervisord.conf
; Start a program later:         .venv/bin/supervisorctl -c supervisord.conf start crm-api

[unix_http_server]
file=/tmp/crm-supervisor.sock
chmod=0700

[supervisord]
logfile=/home/amirreza/projects/Ai Influencer/crm/storage/logs/supervisord.log
pidfile=/tmp/crm-supervisord.pid
childlogdir=/home/amirreza/projects/Ai Influencer/crm/storage/logs
nodaemon=false
user=amirreza

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/crm-supervisor.sock

[include]
files = %(here)s/crm.conf
